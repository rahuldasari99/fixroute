async function load() {
  const t = localStorage.getItem('token');
  if (!t) return location.href='index.html';

  const r = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + t }});

        <p><strong>Status:</strong> <span class="text-success">${j.profile.is_available || "Not Added"}</span></p>
       
  `;

  /* ----------------------------------------------------------
     NEW: LOAD SAVED SERVICEMAN LOCATION ON REFRESH
  ---------------------------------------------------------- */
  const savedLat = j.profile.location_lat;
  const savedLon = j.profile.location_lng;

  if (savedLat && savedLon) {
    document.getElementById("lat").value = savedLat;
    document.getElementById("lon").value = savedLon;

    // Load mapbox token if not loaded yet
    if (!MAPBOX_TOKEN) await loadToken();

    // Clear previous map
    document.getElementById("map").innerHTML = "";

    // Draw the map at saved location
    mapboxgl.accessToken = MAPBOX_TOKEN;

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/streets-v12",
      center: [savedLon, savedLat],
      zoom: 14
    });

    new mapboxgl.Marker({ color: "red" })
      .setLngLat([savedLon, savedLat])
      .addTo(map);
  }
}

/* ----------------------------------------------------------
   NEW FUNCTIONALITY – MAP, UPDATE & DELETE LOCATION
---------------------------------------------------------- */

// Load Mapbox token from backend
let MAPBOX_TOKEN = "";

async function loadToken() {
  const res = await fetch("/api/mapbox-token");
  const j = await res.json();
  MAPBOX_TOKEN = j.token;
}
loadToken();


// Detect and Update Location
document.getElementById("btnDetect").addEventListener("click", () => {
  if (!navigator.geolocation) return alert("Geolocation not supported");

  navigator.geolocation.getCurrentPosition(async pos => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    document.getElementById("lat").value = lat;
    document.getElementById("lon").value = lon;

    // Clear old map before creating a new one
    document.getElementById("map").innerHTML = "";

    // Show Map
    mapboxgl.accessToken = MAPBOX_TOKEN;

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/streets-v12",
      center: [lon, lat],
      zoom: 14
    });

    new mapboxgl.Marker({ color: "red" })
      .setLngLat([lon, lat])
      .addTo(map);

    // Update location in Supabase
    const token = localStorage.getItem("token");

    const res = await fetch("/api/serviceman/update-location", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ lat, lon })
    });

    const j = await res.json();

    if (j.success) {
      alert("Location Updated Successfully!");
    } else {
      alert("Failed: " + JSON.stringify(j.error));
    }

  }, () => {
    alert("Location access denied.");
  });
});


// Delete Serviceman Location
document.getElementById("btnDelete").addEventListener("click", async () => {
  const token = localStorage.getItem("token");

  const res = await fetch("/api/serviceman/delete-location", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token }
  });

  const j = await res.json();

  if (j.success) {
    alert("Location Removed!");
    document.getElementById("lat").value = "";
    document.getElementById("lon").value = "";
    document.getElementById("map").innerHTML = "";
  } else {
    alert("Error: " + JSON.stringify(j.error));
  }
});
</script>
