  <h1>FixRoute — Signup / Login</h1>

  <section>
 
    <h2>Signup</h2>
    <input id="s_name" placeholder="Full name"><br>
    <input id="s_phone" placeholder="Phone"><br>
    <input id="s_email" placeholder="Email"><br>
    <input id="s_password" type="password" placeholder="Password"><br>
    <select id="s_role">
      <option value="user">User</option>
      <option value="serviceman">Serviceman</option>
      <option value="dealer">Dealer</option>
      <option value="admin">Admin</option>
    </select><br>
    <!-- extra fields for serviceman/dealer -->
    <div id="extraFields"></div>
    <button id="btnSignup">Sign up</button>
  </section>

  <section>
    <h2>Login</h2>
    <input id="l_email" placeholder="Email"><br>
    <input id="l_password" type="password" placeholder="Password"><br>
    <select id="l_role">
      <option value="">(optional) Role</option>
      <option value="user">User</option>
      <option value="serviceman">Serviceman</option>
      <option value="dealer">Dealer</option>
      <option value="admin">Admin</option>
    </select><br>
    <button id="btnLogin">Login</button>

  </section>
