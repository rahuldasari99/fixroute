<div class="modal fade" id="staticBackdrop1" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">

      <div class="modal-header">
        <h1 class="modal-title fs-5" id="staticBackdropLabel">SIGNUP</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- signup form start -->
    <section class="modal-signupform">
 
    <h2>Signup</h2>
    <label for="s_name">FULL NAME</label>
    <input id="s_name" placeholder="Full name"><br>
     <label for="s_phone">PHONE NUMBER</label>
    <input id="s_phone" placeholder="Phone"><br>
     <label for="s_email">EMAIL</label>
    <input id="s_email" placeholder="Email"><br>
    <label for="s_password">Password</label>
    <input id="s_password" type="password" placeholder="Password"><br>
    <select id="s_role">
      <option value="user">User</option>
      <option value="serviceman">Serviceman</option>
      <option value="dealer">Dealer</option>
      <option value="admin">Admin</option>
    </select><br>
    <!-- extra fields for serviceman/dealer -->
    <div id="extraFields"></div>
   
  </section>
  <!-- signup form end -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" id="btnSignup" class="btn btn-signup">Signup</button>
      </div>
    </div>
  </div>
</div>
